[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybabytracker"
dynamic = ["version"]
description = "Async Python client for the Nighp Baby Tracker sync service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Will Adler" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.10"]

[project.urls]
Source = "https://github.com/wtadler/pybabytracker"
Issues = "https://github.com/wtadler/pybabytracker/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
pybabytracker = "pybabytracker.cli:main"

[tool.hatch.version]
path = "src/pybabytracker/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pybabytracker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
